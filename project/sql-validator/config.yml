# key to enable log
enable_log: True

# mention the name of sheet to remove from excel workbook before processing
# name should be a list.
worksheet_to_remove:

# master column to check
# can we have aliasing ?
master_columns:
  RFID: VARCHAR(100)
  DTS_PASS: datetime
  DTS_SCAN: datetime
  WORKORDER: VARCHAR(50)
  MODEL_NO: VARCHAR(50)
  CT: float
  Status: VARCHAR(50)
  CELLNO: VARCHAR(50)
  FCS: int
  FCA: int
  Routing: VARCHAR(50)
  Serial_No: int
  DCode: VARCHAR(50)
  ProfitCenterCode: VARCHAR(50)
  MachineCode: VARCHAR(50)
  OperationCode: VARCHAR(50)
  TS_Flag: smallint
  IsRework: bit
# Excel file path
# excel_file_path: "data/schema.xlsx"

# Encoding schemes to try while reading sql file
encodings_schemes:
  ["utf-8-sig", "utf-16", "utf-16-le", "utf-16-be", "cp1252", "latin-1"]

excel_file_path: "output/table_schema.xlsx"

#sql file path
sql_file_path: "data/schema_3.sql"

#template_1 path
template_1_path: "./templates/template_1.txt"
#template_2 path
template_2_path: "./templates/template_2.txt"

# validations for correct schema - table and column names

invalid_charaters: ["&", "(", ")"]
